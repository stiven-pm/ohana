<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago — Ohana Heladería</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="./logo.png" type="image/png">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <link rel="stylesheet" href="./style.css?v=20260704">
</head>
<body class="thanks-page">

  <nav aria-label="Navegación principal">
    <a href="./" class="logo">
      <img class="logo-mark" src="./logo.png" alt="Logo Ohana Heladería">
      Ohana
    </a>
    <a href="./#pedido" class="nav-cta">Volver al menú</a>
  </nav>

  <main class="thanks-main">
    <section class="thanks-card" id="thanks-status" aria-live="polite">
      <p class="section-label">Pago</p>
      <h1 id="thanks-title">Verificando tu pago…</h1>
      <p id="thanks-message">Espera un momento mientras confirmamos con Wompi.</p>
    </section>

    <section class="thanks-card" id="thanks-next" hidden>
      <h2 id="next-title">Siguiente paso</h2>
      <p id="next-message"></p>
      <div id="calendar-wrap" class="calendar-wrap" hidden>
        <iframe id="calendar-embed" title="Programar entrega Ohana" loading="lazy"></iframe>
      </div>
      <div class="thanks-actions">
        <a id="whatsapp-link" class="contact-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
          Confirmar por WhatsApp
        </a>
        <a href="./#pedido" class="btn-outline">Hacer otro pedido</a>
      </div>
    </section>
  </main>

  <script src="./js/config.js?v=20260704"></script>
  <script src="./js/gracias.js?v=20260704"></script>
</body>
</html>
